<meta charset="utf-8">

<title>Docket</title>
<script>
  // GitHub Pages sends every unknown address here. A tool's own address (/docket/merge) goes
  // back to the app, which opens that tool; anything else gets a plain "not found".
  (function () {
    var path = location.pathname, base = path.replace(/[^/]*$/, ""), rest = path.slice(base.length);
    if (/^[\w-]+$/.test(rest)) location.replace(base + location.search + "#/" + rest);
  })();
</script>

</head>
